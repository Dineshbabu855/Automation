# Production deployment workflow for Frappe v15
# Generated by Tridots DevOps
name: "Deploy to Production - Dineshbabu855/Automation (Frappe v15)"

"on":
  push:
    branches: ["version-16"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  FRAPPE_VERSION: "15"
  APP_NAME: "automation_builder"
  PRODUCTION_HOST: "${{ secrets.PRODUCTION_HOST }}"
  PRODUCTION_USER: "${{ secrets.PRODUCTION_USER }}"
  PRODUCTION_SSH_KEY: "${{ secrets.PRODUCTION_SSH_KEY }}"
  PRODUCTION_SITE_URL: "${{ secrets.PRODUCTION_SITE_URL }}"

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "${{ (hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != '') && 'pip' || '' }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache-dependency-path: "**/package-lock.json"
          cache: "${{ (hashFiles('**/package-lock.json') != '') && 'npm' || '' }}"

      - name: Validate required secrets
        run: |
          if [ -z "${{ env.PRODUCTION_HOST }}" ] || [ -z "${{ env.PRODUCTION_USER }}" ] || [ -z "${{ env.PRODUCTION_SSH_KEY }}" ]; then
            echo "::error::Missing required secrets: PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -H "${{ env.PRODUCTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Pre-deployment backup
        run: |
          ssh -i ~/.ssh/production_key ${{ env.PRODUCTION_USER }}@${{ env.PRODUCTION_HOST }} << 'EOF'
            set -e
            cd /home/${{ env.PRODUCTION_USER }}/frappe-bench

            # Create backup before deployment
            echo "Creating pre-deployment backup..."
            bench --site all backup --with-files

            # List recent backups
            ls -lh backups/
          EOF

      - name: Deploy to production server
        run: |
          ssh -i ~/.ssh/production_key ${{ env.PRODUCTION_USER }}@${{ env.PRODUCTION_HOST }} << 'EOF'
            set -e
            cd /home/${{ env.PRODUCTION_USER }}/frappe-bench || { echo "Bench directory not found"; exit 1; }

            # Pull latest changes
            git fetch origin
            git checkout version-16
            git pull origin version-16

            # Update bench and app (with backup)
            bench update --requirements --build --backup

            # Run migrations
            bench --site all migrate

            # Build assets
            bench build

            # Clear cache
            bench --site all clear-cache

            # Restart services
            sudo supervisorctl restart frappe:
            sudo supervisorctl restart frappe-worker:

            echo "Production deployment completed successfully"
          EOF

      - name: Health check
        if: ${{ env.PRODUCTION_SITE_URL != '' }}
        run: |
          echo "Waiting for production site to be ready..."
          sleep 15
          for i in {1..20}; do
            if curl -f -s -o /dev/null -w "%{http_code}" "${{ env.PRODUCTION_SITE_URL }}" | grep -q "200"; then
              echo "Production health check passed!"
              exit 0
            fi
            echo "Attempt $i/20: Site not ready yet, waiting 15s..."
            sleep 15
          done
          echo "::error::Production health check failed after 5 minutes"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Production deployment failed. Manual rollback may be required."
          echo "To rollback, SSH to the server and run:"
          echo "  cd /home/${{ env.PRODUCTION_USER }}/frappe-bench"
          echo "  bench --site all restore <latest-backup-file>"
          echo "  bench build && bench --site all clear-cache && sudo supervisorctl restart frappe:"
          echo ""
          echo "Note: Automated rollback is handled by the platform's deployment infrastructure."
          echo "This workflow provides the backup step and rollback instructions for manual intervention."

  notify:
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Notify result
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "Production deployment successful for ${{ github.repository }}@${{ github.ref_name }}"
          else
            echo "::error::Production deployment FAILED for ${{ github.repository }}@${{ github.ref_name }}"
          fi
          # Add notification integration here (Slack, email, PagerDuty, etc.)
