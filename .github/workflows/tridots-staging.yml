# Staging deployment workflow for Frappe v15
# Generated by Tridots DevOps
name: "Deploy to Staging - Dineshbabu855/Automation (Frappe v15)"

"on":
  push:
    branches: ["version-16"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  FRAPPE_VERSION: "15"
  APP_NAME: "automation_builder"
  STAGING_HOST: "${{ secrets.STAGING_HOST }}"
  STAGING_USER: "${{ secrets.STAGING_USER }}"
  STAGING_SSH_KEY: "${{ secrets.STAGING_SSH_KEY }}"
  STAGING_SITE_URL: "${{ secrets.STAGING_SITE_URL }}"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "${{ (hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != '') && 'pip' || '' }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache-dependency-path: "**/package-lock.json"
          cache: "${{ (hashFiles('**/package-lock.json') != '') && 'npm' || '' }}"

      - name: Validate required secrets
        run: |
          if [ -z "${{ env.STAGING_HOST }}" ] || [ -z "${{ env.STAGING_USER }}" ] || [ -z "${{ env.STAGING_SSH_KEY }}" ]; then
            echo "::error::Missing required secrets: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ env.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh -i ~/.ssh/staging_key ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
            set -e
            cd /home/${{ env.STAGING_USER }}/frappe-bench || { echo "Bench directory not found"; exit 1; }

            # Pull latest changes
            git fetch origin
            git checkout version-16
            git pull origin version-16

            # Update bench and app
            bench update --requirements --build --no-backup

            # Run migrations
            bench --site all migrate

            # Build assets
            bench build

            # Clear cache
            bench --site all clear-cache

            # Restart services
            sudo supervisorctl restart frappe:
            sudo supervisorctl restart frappe-worker:

            echo "Deployment completed successfully"
          EOF

      - name: Health check
        if: ${{ env.STAGING_SITE_URL != '' }}
        run: |
          echo "Waiting for site to be ready..."
          sleep 10
          for i in {1..12}; do
            if curl -f -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_SITE_URL }}" | grep -q "200"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i/12: Site not ready yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 2 minutes"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deployment failed for ${{ github.repository }}@${{ github.ref_name }}"
          # Add notification integration here (Slack, email, etc.)

  notify-success:
    needs: deploy-staging
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: |
          echo "Staging deployment successful for ${{ github.repository }}@${{ github.ref_name }}"
