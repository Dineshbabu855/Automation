# Pre-commit hooks for Frappe v15
# Generated by Tridots DevOps
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown, javascript, jsx, css, scss, less, html]

  - repo: local
    hooks:
      - id: frappe-doctype-lint
        name: Frappe DocType Lint
        entry: python -m frappe.utils.doctype_lint
        language: system
        files: '^.*/doctype/.*\.json$'
        pass_filenames: false
        always_run: false