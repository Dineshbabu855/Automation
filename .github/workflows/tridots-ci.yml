# CI workflow for Frappe v15
# Generated by Tridots DevOps
name: "CI - Dineshbabu855/Automation (Frappe v15)"

"on":
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  FRAPPE_VERSION: "15"
  APP_NAME: "automation_builder"
  TESTS_DETECTED: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "${{ (hashFiles('**/requirements.txt', '**/pyproject.toml', '**/setup.py') != '') && 'pip' || '' }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache-dependency-path: "**/package-lock.json"
          cache: "${{ (hashFiles('**/package-lock.json') != '') && 'npm' || '' }}"

      - name: Install bench
        run: |
          pip install --upgrade pip
          pip install frappe-bench

      - name: Initialize bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "${{ env.PYTHON_VERSION }}" --frappe-branch "version-${{ env.FRAPPE_VERSION }}" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g redis_cache redis://localhost:6379
          bench set-config -g redis_queue redis://localhost:6379

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app ${{ env.APP_NAME }} $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app ${{ env.APP_NAME }}
          bench build
        env:
          CI: 'Yes'

      - name: Run tests
        if: ${{ env.TESTS_DETECTED == 'true' }}
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ${{ env.APP_NAME }}
        env:
          CI: 'Yes'

      - name: Lint Python (ruff)
        continue-on-error: true
        run: |
          cd /home/runner/frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f pyproject.toml ] || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            pip install ruff
            ruff check .
          else
            echo "No ruff config found, skipping Python lint"
          fi

      - name: Lint Python (flake8 fallback)
        continue-on-error: true
        run: |
          cd /home/runner/frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f setup.cfg ] || [ -f tox.ini ] || [ -f .flake8 ]; then
            pip install flake8
            flake8 .
          else
            echo "No flake8 config found, skipping"
          fi

      - name: Lint JavaScript/TypeScript (eslint)
        continue-on-error: true
        run: |
          cd /home/runner/frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm ci
            npm run lint
          else
            echo "No lint script in package.json, skipping JS lint"
          fi

      - name: Build frontend assets
        continue-on-error: true
        run: |
          cd /home/runner/frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f package.json ]; then
            npm ci
            if grep -q '"build"' package.json; then
              npm run build
            else
              echo "No build script in package.json, skipping"
            fi
          else
            echo "No package.json found, skipping frontend build"
          fi

      - name: Run pre-commit hooks
        continue-on-error: true
        run: |
          cd /home/runner/frappe-bench/apps/${{ env.APP_NAME }}
          if [ -f .pre-commit-config.yaml ]; then
            pip install pre-commit
            pre-commit run --all-files
          else
            echo "No .pre-commit-config.yaml found, skipping pre-commit"
          fi



  notify-failure:
    needs: lint-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        run: |
          echo "CI pipeline failed for ${{ github.repository }}@${{ github.ref_name }}"
          # Add Slack/email notification here if configured
